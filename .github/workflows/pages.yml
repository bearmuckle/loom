name: Deploy browser client to GitHub Pages

# Actions are pinned to a full commit SHA: the job here holds `pages: write` and
# `id-token: write`. The trailing comment names the version each SHA was resolved
# from, and `.github/dependabot.yml` keeps the pins current.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Test browser entry point
        run: node --experimental-vm-modules --test scripts/browser-entry.test.mjs scripts/pwa.test.mjs

      - name: Install Rust and WASM target
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: trunk

      - name: Cache Rust dependencies
        # The GPUI/wgpu tree takes minutes to compile; caching it keeps a deploy
        # from paying that cost on every push. Same pin as the `wasm` job in
        # `ci.yml` so both jobs share the action version.
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build browser client
        working-directory: crates/loom-ui
        env:
          RUSTC_BOOTSTRAP: "1"
        run: trunk build --release --public-url /loom/

      - name: Generate stable browser entry point
        run: node scripts/build-browser-entry.mjs crates/loom-ui/dist

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: crates/loom-ui/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
