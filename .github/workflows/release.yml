name: Release

# Actions are pinned to a full commit SHA: the jobs here hold `id-token: write`
# and `attestations: write`, so a moved tag would be a release compromise. The
# trailing comment names the version each SHA was resolved from, and
# `.github/dependabot.yml` keeps the pins current.

on:
  push:
    tags:
      - "v*"

# Least privilege: each job grants itself only what it publishes or attests.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  # Both binaries stamp `--version` from these values: the tag is what a released
  # binary must report, and the revision is the commit it was built from. The
  # stamping build scripts re-run when they change, so the stamps survive a
  # restored `target/` cache.
  LOOM_BUILD_VERSION: ${{ github.ref_name }}

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The same native packages as `.github/workflows/ci.yml`: the GPUI client
      # links them; visual render tests are optional local checks.
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked --lib --bins --tests

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # This job may run alongside `verify`, but nothing it produces is published
    # before the checks pass: `publish` and `container` both need `verify`.
    permissions:
      contents: read
      # SLSA build provenance is signed with a short-lived OIDC identity and the
      # attestation is attached to this repository.
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 keeps the glibc floor of the Linux artifacts at 2.35,
          # which is what the AppImages and the `.deb` packages target.
          - name: linux-x86_64
            os: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            bin_dir: target/x86_64-unknown-linux-gnu/release
            exe: ""
            appimage_arch: x86_64
            deb_variant: ""
            archive: tar.gz
          # The current GitHub-hosted arm64 label. Its glibc is newer than the
          # x86_64 job's, so the arm64 artifacts need a newer distribution than
          # the x86_64 ones; there is no 22.04 arm64 runner image to match them.
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            rust_targets: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            bin_dir: target/aarch64-unknown-linux-gnu/release
            exe: ""
            appimage_arch: aarch64
            # Selects `[package.metadata.deb.variants.aarch64]`, which declares
            # this runner image's newer glibc floor.
            deb_variant: aarch64
            archive: tar.gz
          # macOS ships one universal binary per package: both slices are built
          # on macos-14 (itself arm64) and combined with `lipo`.
          - name: macos-universal
            os: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: ""
            bin_dir: target/universal/release
            exe: ""
            appimage_arch: ""
            archive: tar.gz
            universal: true
          - name: windows-x86_64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            bin_dir: target/x86_64-pc-windows-msvc/release
            exe: .exe
            appimage_arch: ""
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_targets }}
      # On top of the client's native packages, `git2` builds its own libgit2
      # (no distribution ships the version range libgit2-sys accepts for a
      # system libgit2), so the build needs a C toolchain, CMake and OpenSSL.
      # `patchelf` and `file` are what linuxdeploy and appimagetool use.
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            build-essential \
            cmake \
            libssl-dev \
            zlib1g-dev \
            file \
            patchelf
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # cargo-deb
        if: runner.os == 'Linux'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
      - name: Stamp the git revision
        shell: bash
        run: echo "LOOM_GIT_REVISION=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - name: Build client and server
        if: ${{ !matrix.universal }}
        run: cargo build --release --locked --package loom-ui --package loom-server --target ${{ matrix.target }}
      - name: Build client and server (apple silicon slice)
        if: matrix.universal
        run: cargo build --release --locked --package loom-ui --package loom-server --target aarch64-apple-darwin
      - name: Build client and server (intel slice)
        if: matrix.universal
        run: cargo build --release --locked --package loom-ui --package loom-server --target x86_64-apple-darwin
      - name: Combine the macOS slices
        if: matrix.universal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/universal/release
          for bin in loom-ui loom-server; do
            lipo -create \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin" \
              -output "target/universal/release/$bin"
            archs="$(lipo -archs "target/universal/release/$bin")"
            echo "$bin: $archs"
            # A universal archive must not silently lose a slice.
            case "$archs" in
              *x86_64*arm64* | *arm64*x86_64*) ;;
              *) echo "$bin is not universal: $archs" >&2; exit 1 ;;
            esac
          done
      - name: Verify the binaries report the release tag
        shell: bash
        run: |
          set -euo pipefail
          for bin in loom-ui loom-server; do
            reported="$("${{ matrix.bin_dir }}/$bin${{ matrix.exe }}" --version)"
            echo "$bin --version: $reported"
            case "$reported" in
              *"$GITHUB_REF_NAME"*) ;;
              *) echo "$bin does not report $GITHUB_REF_NAME: $reported" >&2; exit 1 ;;
            esac
          done
      - name: Package release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # The client archive also carries loom-server: the client starts it as
          # its managed local worker, and a binary next to the client is found
          # before any download, so an unpacked archive works offline.
          for bin in loom-ui loom-server; do
            files=("$bin${{ matrix.exe }}")
            if [ "$bin" = loom-ui ]; then
              files+=("loom-server${{ matrix.exe }}")
            fi
            if [ "${{ matrix.archive }}" = "zip" ]; then
              paths=()
              for file in "${files[@]}"; do
                paths+=("${{ matrix.bin_dir }}/$file")
              done
              7z a "dist/$bin-$GITHUB_REF_NAME-${{ matrix.name }}.zip" \
                "${paths[@]}" LICENSE-AGPL LICENSES.md
            else
              tar -czf "dist/$bin-$GITHUB_REF_NAME-${{ matrix.name }}.tar.gz" \
                -C "${{ matrix.bin_dir }}" "${files[@]}" \
                -C "$GITHUB_WORKSPACE" LICENSE-AGPL LICENSES.md
            fi
          done
          ls -l dist
      - name: Build AppImage
        if: runner.os == 'Linux'
        env:
          ARCH: ${{ matrix.appimage_arch }}
          TARGET: ${{ matrix.target }}
        run: packaging/build-appimage.sh dist
      - name: Build .deb package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb_args=""
          if [ -n "${{ matrix.deb_variant }}" ]; then
            deb_args="--variant ${{ matrix.deb_variant }}"
          fi
          # `$deb_args` is deliberately unquoted: it is empty or exactly one
          # option, and it must word-split.
          cargo deb --package loom-ui --no-build --target "${{ matrix.target }}" \
            --deb-version "${GITHUB_REF_NAME#v}" $deb_args
          # cargo-deb writes the package next to the target directory it used.
          deb="$(find target -name '*.deb' -print -quit)"
          cp "$deb" dist/
      - name: Check the .deb package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb="$(find dist -name '*.deb' -print -quit)"
          dpkg-deb --info "$deb"
          # Read the archive listing once and match against it. Piping
          # `dpkg-deb --contents` into `grep -q` lets grep exit on the first
          # match, which closes the pipe and kills tar with SIGPIPE; under
          # `pipefail` that reports a present file as missing.
          contents="$(dpkg-deb --contents "$deb")"
          for asset in usr/bin/loom-ui \
            usr/bin/loom-server \
            usr/share/applications/loom-ui.desktop \
            usr/share/icons/hicolor/512x512/apps/loom-ui.png; do
            grep -Fq "$asset" <<<"$contents" \
              || { echo "$deb is missing $asset" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      # Attested from the job that built the files, so the provenance names the
      # workflow run that produced these exact digests.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-sbom
        # Pinned: an unpinned `cargo install` would change the SBOM generator
        # that runs against a tagged release without review.
        run: cargo install cargo-sbom --locked --version 0.10.0
      - name: Generate a CycloneDX SBOM from Cargo.lock
        run: |
          mkdir -p dist
          cargo sbom --output-format cyclone_dx_json_1_6 > "dist/loom-$GITHUB_REF_NAME.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: dist/*
          if-no-files-found: error
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  container:
    name: Publish server image
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/loom-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build the server image
        run: |
          docker buildx build --load \
            --build-arg "LOOM_BUILD_VERSION=$GITHUB_REF_NAME" \
            --build-arg "LOOM_GIT_REVISION=$(git rev-parse --short=12 HEAD)" \
            --tag loom-server:ci .
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run --rm loom-server:ci --version
          docker run --rm loom-server:ci --help
          # Started on a port that is not the image's default, so the health check
          # has to follow this overridden command line rather than a hardcoded
          # 8765. The role label and variable are what tell a pipeline container
          # apart from an agent worker container (issue #241).
          docker run -d --name loom-server-smoke \
            --label loom.deployment-role=server-image-smoke-test \
            -e LOOM_DEPLOYMENT_ROLE=server-image-smoke-test \
            loom-server:ci \
            --bind 0.0.0.0:18765 --allow-insecure-remote \
            --token smoke-test-token --persistence /var/lib/loom/loom.db
          status=starting
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' loom-server-smoke)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs loom-server-smoke
          test "$status" = healthy
          # `healthy` above can only have come from the probe answering on the
          # overridden port, and this checks that port directly.
          docker exec loom-server-smoke curl -fsS http://127.0.0.1:18765/health
          docker rm -f loom-server-smoke
      - name: Smoke test the image over TLS
        run: |
          set -euo pipefail
          # The default command above serves plaintext under the documented
          # opt-in; self-contained TLS is the alternative it points at, and a
          # regression there would otherwise surface only at a user's first
          # deployment. The certificate is self-signed and exists only for this
          # probe.
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout tls/key.pem -out tls/cert.pem -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"
          chmod 644 tls/cert.pem tls/key.pem
          # No `--allow-insecure-remote`: a non-loopback bind is allowed here
          # precisely because TLS is configured.
          docker run -d --name loom-server-tls -v "$PWD/tls:/tls:ro" \
            --label loom.deployment-role=server-image-smoke-test \
            -e LOOM_DEPLOYMENT_ROLE=server-image-smoke-test \
            loom-server:ci \
            --bind 0.0.0.0:8765 --token smoke-test-token \
            --tls-cert /tls/cert.pem --tls-key /tls/key.pem
          served=""
          for _ in $(seq 1 30); do
            if docker exec loom-server-tls curl -fsSk https://127.0.0.1:8765/health >/dev/null 2>&1; then
              served=yes
              break
            fi
            sleep 2
          done
          docker logs loom-server-tls
          test -n "$served"
          # `-k` because the probe certificate is self-signed. Answering at all
          # proves the listener completed a TLS handshake and served over it.
          docker exec loom-server-tls curl -fsSk https://127.0.0.1:8765/health
          docker rm -f loom-server-tls
      - name: Report the execution context from inside the image
        run: |
          set -euo pipefail
          # An operator reads `--diagnostics` to find out whether agent commands
          # run on the host or in a container, so this checks the report works in
          # the published image and that a container this pipeline starts is
          # distinguishable from an agent worker container (issue #241). The
          # command exits before binding a listener, so nothing is left behind.
          diagnostics="$(docker run --rm \
            --label loom.deployment-role=server-image-smoke-test \
            -e LOOM_DEPLOYMENT_ROLE=server-image-smoke-test \
            loom-server:ci --diagnostics)"
          printf '%s\n' "$diagnostics"
          grep -Fq 'execution-context: container' <<<"$diagnostics"
          grep -Fq 'deployment-role: server-image-smoke-test' <<<"$diagnostics"
      - name: Smoke test the documented persistence and removal semantics
        run: |
          set -euo pipefail
          # The documented persistence boundary: everything below
          # LOOM_STATE_DIR is durable state, so mounting a volume there is what
          # lets a replacement container reuse the database and the generated
          # token. Removing the container must not remove either, and a second
          # start on the same volume must reuse the same token instead of
          # minting a new one that invalidates every connected client.
          docker volume create loom-server-smoke-state
          state_root=/var/lib/loom
          instance="$state_root/loom/loom-server"
          start_server() {
            docker run -d --name "$1" \
              --label loom.deployment-role=server-image-smoke-test \
              -e LOOM_DEPLOYMENT_ROLE=server-image-smoke-test \
              -v loom-server-smoke-state:"$state_root" \
              loom-server:ci \
              --bind 0.0.0.0:8765 --allow-insecure-remote \
              --instance-name loom-server
          }
          wait_healthy() {
            local status=starting
            for _ in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$1")"
              [ "$status" = healthy ] && return 0
              sleep 2
            done
            docker logs "$1"
            echo "$1 never became healthy" >&2
            return 1
          }
          cleanup() {
            docker rm -f loom-server-smoke-state-1 loom-server-smoke-state-2 \
              >/dev/null 2>&1 || true
            docker volume rm loom-server-smoke-state >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          start_server loom-server-smoke-state-1
          wait_healthy loom-server-smoke-state-1
          first_token="$(docker exec loom-server-smoke-state-1 cat "$instance/token")"
          test -n "$first_token"
          # The container is removed, the volume and its state are not.
          docker rm -f loom-server-smoke-state-1
          start_server loom-server-smoke-state-2
          wait_healthy loom-server-smoke-state-2
          second_token="$(docker exec loom-server-smoke-state-2 cat "$instance/token")"
          test "$second_token" = "$first_token"
          # The reuse is also logged, which is the line an operator greps for.
          docker logs loom-server-smoke-state-2 2>&1 \
            | grep -F "Reusing the bearer token in '$instance/token'"
          docker exec loom-server-smoke-state-2 test -s "$instance/state.db"
          # `cleanup` on exit removes both containers and the volume.
      - name: Smoke test the documented egress policy
        run: |
          set -euo pipefail
          # The documented policy says the published image can reach the provider,
          # forge and package-registry endpoints it needs by name, so this checks
          # DNS resolution and HTTPS from *inside* the image rather than on the
          # runner: the image's own certificates and network stack are what an
          # operator deploys. Each check retries, because a transient registry
          # error must not fail a release. The package-registry check targets the
          # crates.io index Cargo itself uses, not the website root: the site
          # answers 403 to non-browser clients, which is reachable but not a 2xx.
          docker run --rm --entrypoint /bin/sh \
            --label loom.deployment-role=server-image-smoke-test \
            -e LOOM_DEPLOYMENT_ROLE=server-image-smoke-test \
            loom-server:ci -c '
              set -eu
              retry() {
                what="$1"
                shift
                attempt=1
                while [ "$attempt" -le 3 ]; do
                  if "$@"; then
                    echo "ok: $what"
                    return 0
                  fi
                  echo "attempt $attempt of 3 failed: $what" >&2
                  attempt=$((attempt + 1))
                  sleep 5
                done
                echo "the image cannot $what; the documented egress policy requires it" >&2
                exit 1
              }
              retry "resolve github.com" getent hosts github.com
              retry "reach https://api.github.com/" curl -fsS --max-time 20 -o /dev/null https://api.github.com/
              retry "reach the crates.io index" curl -fsS --max-time 20 -o /dev/null https://index.crates.io/config.json
            '
      - name: Log in to the container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the image tagged with the release tag and `latest`
        id: push
        run: |
          set -euo pipefail
          # The image was built and smoke tested above, so this reuses the build
          # cache and only publishes it.
          docker buildx build --push \
            --build-arg "LOOM_BUILD_VERSION=$GITHUB_REF_NAME" \
            --build-arg "LOOM_GIT_REVISION=$(git rev-parse --short=12 HEAD)" \
            --tag "$IMAGE:$GITHUB_REF_NAME" \
            --tag "$IMAGE:latest" \
            --metadata-file "$RUNNER_TEMP/image.json" .
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/image.json")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/loom-server
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish GitHub release
    # Nothing is published unless the tagged tree passes the workspace checks and
    # every build succeeded.
    needs: [verify, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes are generated from the full commit history between
      # the previous tag and this one, so the checkout needs every commit and
      # tag. Keep this before `download-artifact`: checkout cleans the
      # workspace, which would remove the downloaded assets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd release-assets
          ls -l
          # Written to a temporary path so the manifest never lists itself.
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" .
          cat SHA256SUMS
      - name: Compose the release notes
        # The release page is the changelog, not the installation manual: the
        # README and docs/deployment.md already carry those instructions. The
        # script walks the commits between tags, so direct pushes to main and
        # not only merged pull requests appear in the notes.
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
