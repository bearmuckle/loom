name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-entry:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test browser entry point
        run: node --experimental-vm-modules --test scripts/browser-entry.test.mjs scripts/pwa.test.mjs

  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Incremental artifacts are never reused in a one-shot CI build and
      # roughly double target/ size; disabling them avoids exhausting the
      # runner's disk on this dependency-heavy (GPUI/wgpu) workspace.
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: github.event_name == 'pull_request'
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        if: github.event_name == 'push'
        run: cargo test --workspace --locked --lib --bins --tests
      - name: Run tests and collect coverage
        if: github.event_name == 'pull_request'
        run: cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: Enforce patch coverage on changed lines
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install --quiet diff-cover
          git fetch origin "${{ github.base_ref }}"
          diff-cover lcov.info \
            --compare-branch="origin/${{ github.base_ref }}" \
            --fail-under=75 \
            --exclude 'crates/*/src/tests.rs' \
            --exclude 'crates/*/src/tests/*' \
            --exclude 'crates/*/src/*/tests.rs' \
            --exclude 'crates/*/src/*/tests/*' \
            --exclude 'crates/*/tests/*'
