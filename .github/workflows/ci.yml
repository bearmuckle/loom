name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Incremental artifacts are never reused in a one-shot CI build and
      # roughly double target/ size; disabling them avoids exhausting the
      # runner's disk on this dependency-heavy (GPUI/wgpu) workspace.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        uses: endersonmenezes/free-disk-space@2a22f8c59cae9cddae7194b33e6b92d023b2b4b8 # v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
      - uses: actions/checkout@v4
      - name: Install native UI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libdbus-1-dev \
            libxcb1-dev \
            libfontconfig1-dev \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests and enforce coverage threshold
        run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 80 --lcov --output-path lcov.info
      - name: Build application binaries
        if: github.event_name == 'pull_request'
        run: cargo build -p loom-ui -p loom-cli --locked
      - name: Build workspace
        if: github.event_name == 'push'
        run: cargo build --workspace --locked
