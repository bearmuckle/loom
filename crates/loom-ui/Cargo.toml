[package]
name = "loom-ui"
description = "GPUI native agent workspace and orchestration client for Loom M5."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
rust-version.workspace = true

[[bin]]
name = "loom-ui"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
gpui.workspace = true
loom-core.workspace = true
loom-model.workspace = true
loom-protocol.workspace = true
loom-workspace.workspace = true
futures-channel.workspace = true
log.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger.workspace = true
open.workspace = true
git_ui = { git = "https://github.com/zed-industries/zed", rev = "bcf6582ce3500df93a8a39366640173e6786cea6" }
zed_client.workspace = true
zed_component.workspace = true
zed_editor.workspace = true
zed_fs.workspace = true
zed_language.workspace = true
zed_language_model.workspace = true
zed_languages.workspace = true
zed_node_runtime.workspace = true
zed_project.workspace = true
zed_session.workspace = true
zed_settings.workspace = true
zed_theme.workspace = true
zed_theme_settings.workspace = true
zed_util.workspace = true
zed_workspace.workspace = true
loom-agent.workspace = true
loom-process.workspace = true
loom-providers.workspace = true
loom-server.workspace = true
loom-vcs.workspace = true
sha2.workspace = true
tokio.workspace = true
keyring.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys.workspace = true
getrandom.workspace = true
