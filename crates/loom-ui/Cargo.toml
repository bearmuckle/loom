[package]
name = "loom-ui"
description = "GPUI native agent workspace and orchestration client for Loom M5."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true

[[bin]]
name = "loom-ui"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["getrandom"] # Enables wasm_js for transitive browser dependencies.

[dependencies]
gpui-kit.workspace = true
loom-core.workspace = true
loom-model.workspace = true
loom-protocol.workspace = true
loom-workspace.workspace = true
futures-channel.workspace = true
log.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger.workspace = true
open.workspace = true
loom-providers.workspace = true
loom-persistence.workspace = true
loom-server.workspace = true
loom-vcs.workspace = true
sha2.workspace = true
tokio.workspace = true
keyring.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys.workspace = true
getrandom.workspace = true
