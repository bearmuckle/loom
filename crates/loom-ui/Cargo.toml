[package]
name = "loom-ui"
description = "GPUI native agent workspace and orchestration client for Loom M5."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true

[[bin]]
name = "loom-ui"
path = "src/main.rs"

[package.metadata.cargo-machete]
ignored = ["getrandom"] # Enables wasm_js for transitive browser dependencies.

# `packaging/loom.desktop` and the PWA icon are installed under the names the
# desktop file's `Exec`/`Icon` keys use, so the launcher entry, the icon and the
# AppImage all agree.
#
# `depends` names the native libraries this client loads when it starts. All of
# them are visible in the built binary: `libssl3` and `zlib1g` come from the
# vendored libgit2 build, `libgcc-s1` from the Rust runtime, and the X11 and
# input libraries are linked directly. There is deliberately no `libfontconfig1`
# here: the font stack reads fontconfig files through the pure-Rust
# `fontconfig_parser`/`fontdb` crates, so the C library is a build-time header
# dependency rather than a runtime one.
# `mesa-vulkan-drivers` (or another Vulkan/OpenGL driver) and a font package are
# runtime data and drivers rather than libraries, so they are recommendations.
[package.metadata.deb]
maintainer = "Björn Harrtell <141030+bjornharrtell@users.noreply.github.com>"
copyright = "2026, Björn Harrtell"
license-file = ["../../LICENSE-AGPL", "0"]
section = "devel"
priority = "optional"
depends = "libc6 (>= 2.35), libgcc-s1, libssl3, zlib1g, libxcb1, libxcb-xkb1, libxkbcommon0, libxkbcommon-x11-0"
recommends = "mesa-vulkan-drivers, fonts-dejavu-core"
extended-description = """
 Loom is a remote-first coding-agent environment. This package installs the
 native desktop client, which runs agent sessions locally or against a remote
 loom-server backend, and can also host an embedded backend of its own.
"""
assets = [
  ["target/release/loom-ui", "usr/bin/", "755"],
  ["../../packaging/loom.desktop", "usr/share/applications/loom-ui.desktop", "644"],
  ["pwa/icon-512.png", "usr/share/icons/hicolor/512x512/apps/loom-ui.png", "644"],
  ["../../LICENSES.md", "usr/share/doc/loom-ui/", "644"],
]

# The Linux release jobs do not share a glibc floor: x86_64 is built on
# `ubuntu-22.04` (glibc 2.35) while aarch64 uses the arm64 runner image (glibc
# 2.39, measured). One `depends` string cannot be right for both: `2.35`
# understates aarch64, so dpkg would install a package whose binary then fails at
# startup, while `2.39` would refuse to install on the x86_64 build platform
# itself. The variant restates `name` because cargo-deb otherwise appends the
# variant name to the package name, which would change the documented install
# command and give the two architectures different package names.
[package.metadata.deb.variants.aarch64]
name = "loom-ui"
depends = "libc6 (>= 2.39), libgcc-s1, libssl3, zlib1g, libxcb1, libxcb-xkb1, libxkbcommon0, libxkbcommon-x11-0"

[features]
# Opt-in pixel capture through GPUI's headless renderer. It needs a Vulkan or
# GL adapter (Mesa's lavapipe works on headless CI), so it stays out of the
# default test run; see `src/view/tests/visual_render_tests.rs`.
visual-tests = []

[dependencies]
gpui-kit.workspace = true
loom-core.workspace = true
loom-model.workspace = true
loom-protocol.workspace = true
futures-channel.workspace = true
log.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
loom-server.workspace = true
tokio.workspace = true
ttf-parser.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
env_logger.workspace = true
open.workspace = true
loom-local.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
console_log.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
js-sys.workspace = true
getrandom.workspace = true
