[package]
name = "loom-cli"
description = "Headless client of the versioned Loom protocol; embeds no backend."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-only"
rust-version.workspace = true

[[bin]]
name = "loom-cli"
path = "src/bin/loom-cli.rs"

[dependencies]
loom-core.workspace = true
loom-local.workspace = true
loom-model.workspace = true
loom-protocol.workspace = true
serde_json.workspace = true
tokio.workspace = true

# The tests drive the verbs against a real in-process backend.
[dev-dependencies]
loom-server.workspace = true
