[workspace]
members = [
    "crates/loom-core",
    "crates/loom-tools",
    "crates/loom-workspace",
    "crates/loom-vcs",
    "crates/loom-process",
    "crates/loom-model",
    "crates/loom-protocol",
    "crates/loom-providers",
    "crates/loom-agent",
    "crates/loom-session",
    "crates/loom-context",
    "crates/loom-persistence",
    "crates/loom-server",
    "crates/loom-cli",
    "crates/loom-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
loom-core = { path = "crates/loom-core" }
loom-tools = { path = "crates/loom-tools" }
loom-workspace = { path = "crates/loom-workspace" }
loom-vcs = { path = "crates/loom-vcs" }
loom-process = { path = "crates/loom-process" }
loom-model = { path = "crates/loom-model" }
loom-protocol = { path = "crates/loom-protocol" }
loom-providers = { path = "crates/loom-providers" }
loom-agent = { path = "crates/loom-agent" }
loom-session = { path = "crates/loom-session" }
loom-context = { path = "crates/loom-context" }
loom-persistence = { path = "crates/loom-persistence" }
loom-server = { path = "crates/loom-server" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
console_log = "1.0"
thiserror = "2.0"
gpui = { package = "gpui-pre", version = "0.3.5" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.5", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-base = "0.6.1"
gpui-component = "0.6.1"
gpui-kit-assets = "0.6.1"
open = "5.4.4"
ureq = { version = "3.4.2", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
sha2 = "0.11.0"
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = "0.30.0"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
js-sys = "0.3.105"
web-sys = { version = "0.3.105", features = [
    "Location",
    "Window",
    "WebSocket",
    "MessageEvent",
    "CloseEvent",
    "ErrorEvent",
    "Event",
    "UrlSearchParams",
] }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
futures-channel = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ignore = "0.4.33"
globset = "0.4.20"
url = "2.5.8"
